  <style>
/* =========================================================
   Roadtrip Companion 2026 — premium dark theme
   Mobile-first · high-contrast for sunlight · Land Rover Bronze
   ========================================================= */

:root{
  /* Core surfaces */
  --bg:#111111;
  --bg-2:#0c0c0c;
  --card:#191919;
  --card-2:#1f1f20;
  --card-3:#242426;
  --line:#2c2c2e;
  --line-soft:#242426;

  /* Text */
  --text:#f5f5f4;
  --muted:#a4a4a2;
  --faint:#77776f;

  /* Land Rover Bronze accent */
  --bronze:#c79a63;
  --bronze-deep:#a97c46;
  --bronze-soft:#3a2f22;
  --bronze-glow:rgba(199,154,99,.16);

  /* Semantic */
  --must:#ff6a2b;      /* oranje / rood-oranje = MOET */
  --nice:#f5a623;      /* oranje = LEUK */
  --bonus:#2fa66d;     /* groen = BONUS + afgerond */
  --nav:#4f9cf0;       /* blauw = navigatie */
  --done:#2fa66d;

  --radius:20px;
  --radius-sm:14px;
  --radius-xs:11px;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --shadow-soft:0 4px 18px rgba(0,0,0,.35);
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:840px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 620px at 82% -8%, #1a1712 0%, transparent 58%),
    radial-gradient(900px 500px at -12% 4%, #14161a 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
}

/* ---------- Header ---------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(14,14,14,.82);
  backdrop-filter:saturate(160%) blur(18px);
  -webkit-backdrop-filter:saturate(160%) blur(18px);
  border-bottom:1px solid var(--line-soft);
}
.header-inner{max-width:var(--maxw);margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  font-size:20px;color:var(--bronze);
  border:1.5px solid var(--bronze-deep);border-radius:12px;
  width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(160deg,var(--bronze-soft),transparent);
  letter-spacing:-2px;
}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}

.progress-ring{
  flex:0 0 auto;width:52px;height:52px;border-radius:50%;
  border:none;cursor:pointer;color:var(--text);
  font-size:12px;font-weight:800;
  background:
    radial-gradient(closest-side, var(--card) 78%, transparent 79%),
    conic-gradient(var(--bronze) var(--p,0%), #2a2a2a 0);
  display:grid;place-items:center;
  transition:transform .2s var(--ease);
}
.progress-ring:active{transform:scale(.92)}

/* ---------- Day tabs (swipe) ---------- */
.day-tabs{
  display:flex;gap:9px;overflow-x:auto;scroll-behavior:smooth;
  padding:14px 0 13px;margin-top:10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{
  flex:0 0 auto;min-width:60px;
  border:1px solid var(--line);background:#161616;color:var(--text);
  border-radius:var(--radius-xs);padding:9px 12px;
  font-weight:800;font-size:16px;line-height:1;text-align:center;cursor:pointer;
  transition:background .22s var(--ease),border-color .22s var(--ease),transform .12s var(--ease),color .22s var(--ease);
}
.day-tab span{display:block;color:var(--muted);font-size:10.5px;font-weight:700;margin-top:5px;letter-spacing:.02em}
.day-tab:active{transform:scale(.95)}
.day-tab.active{
  background:linear-gradient(155deg,var(--bronze),var(--bronze-deep));
  border-color:var(--bronze);color:#161009;
  box-shadow:0 6px 20px var(--bronze-glow);
}
.day-tab.active span{color:#3a2a15}
.day-tab.practical.active{background:linear-gradient(155deg,#e0e0dc,#b8b8b3);border-color:#cfcfc9;color:#161616}
.day-tab.practical.active span{color:#333}

/* ---------- Main / panels ---------- */
main{max-width:var(--maxw);margin:auto;padding:20px 16px 40px}
.panel{display:none;animation:fadeUp .45s var(--ease)}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- Day hero ---------- */
.day-hero{margin-bottom:18px}
.day-eyebrow{color:var(--bronze);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.13em}
.day-hero h2{margin:8px 0 4px;font-size:29px;line-height:1.08;font-weight:800;letter-spacing:-.02em}
.day-hero .subtitle{margin:0;color:var(--muted);font-size:15px}

/* Stat strip: km / rijtijd / vertrek / aankomst */
.stat-strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;
}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 10px;text-align:center;
}
.stat .k{display:block;font-size:10px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.stat .v{display:block;font-size:16px;font-weight:800;margin-top:4px}
.stat.accent .v{color:var(--bronze)}
.stat.nav .v{color:var(--nav)}

/* Route buttons */
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
.route-btn{
  display:flex;flex-direction:column;gap:2px;align-items:flex-start;justify-content:center;
  min-height:60px;border-radius:var(--radius-sm);text-decoration:none;padding:12px 14px;
  font-weight:800;color:#fff;border:1px solid transparent;
  transition:transform .12s var(--ease),filter .2s var(--ease);
}
.route-btn small{font-weight:700;font-size:11px;opacity:.85}
.route-btn:active{transform:scale(.97)}
.route-comfort{background:linear-gradient(150deg,#1f6b4a,#17583c)}
.route-epic{background:linear-gradient(150deg,var(--bronze),var(--bronze-deep));color:#1a1206}

/* Advice / weather-alt / warning banners */
.banner{border-radius:var(--radius-sm);padding:13px 15px;line-height:1.5;font-size:14px;margin-bottom:14px}
.banner strong{color:var(--text)}
.banner-advice{background:linear-gradient(150deg,#241d13,#1c1710);border:1px solid var(--bronze-soft);color:#e9d3b4}
.banner-weather{background:#12202f;border:1px solid #244566;color:#a9cdf3}
.banner-weather::before{content:"🌧️  ";}
.warning{background:#2a1c12;border:1px solid #5c3d24;color:#f4c9a5;border-radius:var(--radius-xs);padding:10px 12px;font-size:13.5px;line-height:1.45;margin:10px 0}

/* ---------- Section headings (MUST / NICE / BONUS) ---------- */
.cat-head{display:flex;align-items:center;gap:9px;margin:24px 0 12px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
.cat-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.cat-must .cat-dot{background:var(--must);box-shadow:0 0 0 4px rgba(255,106,43,.15)}
.cat-nice .cat-dot{background:var(--nice);box-shadow:0 0 0 4px rgba(245,166,35,.15)}
.cat-bonus .cat-dot{background:var(--bonus);box-shadow:0 0 0 4px rgba(47,166,109,.15)}
.cat-must{color:#ffb492}.cat-nice{color:#f6cd83}.cat-bonus{color:#8ad9b3}

/* ---------- Stop card (accordion) ---------- */
.stop{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:11px;overflow:hidden;
  transition:border-color .25s var(--ease),background .25s var(--ease);
}
.stop.done{border-color:rgba(47,166,109,.5);background:linear-gradient(160deg,#14201a,#161616)}
.stop-summary{
  display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;
  padding:15px 16px;cursor:pointer;user-select:none;
}
/* Big checkbox */
.check{position:relative;flex:0 0 auto}
.check input{position:absolute;opacity:0;width:30px;height:30px;margin:0;cursor:pointer}
.check .box{
  width:30px;height:30px;border-radius:9px;border:2px solid #5c5c5a;
  display:grid;place-items:center;transition:all .2s var(--ease);
  background:#141414;
}
.check input:checked + .box{background:var(--done);border-color:var(--done);transform:scale(1)}
.check .box::after{content:"✓";font-weight:900;font-size:17px;color:#0c1a12;opacity:0;transform:scale(.4);transition:all .22s var(--ease)}
.check input:checked + .box::after{opacity:1;transform:scale(1)}
.stop-emoji{font-size:23px;line-height:1}
.stop-main{min-width:0}
.stop-title{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.stop-sub{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:5px;font-size:12.5px;color:var(--muted)}
.stop-sub .stars{color:var(--bronze);letter-spacing:1px}
.chev{color:var(--faint);font-size:15px;transition:transform .28s var(--ease);flex:0 0 auto}
.stop.open .chev{transform:rotate(180deg)}

.stop-body{
  max-height:0;opacity:0;overflow:hidden;
  transition:max-height .4s var(--ease),opacity .3s var(--ease),padding .3s var(--ease);
  padding:0 16px;
}
.stop.open .stop-body{max-height:1400px;opacity:1;padding:0 16px 16px}
.stop-body p{color:var(--muted);line-height:1.55;margin:2px 0 12px;font-size:14.5px}
.tip{display:flex;gap:8px;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-xs);padding:10px 12px;font-size:13.5px;color:#d8d3ca;margin-bottom:12px}
.tip b{color:var(--bronze);white-space:nowrap}
.info-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.pill{background:var(--card-3);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:#cfcbc2}
.pill.best{color:#a9cdf3;border-color:#244566;background:#12202f}
.pill.weather{color:#f4c9a5;border-color:#5c3d24;background:#2a1c12}

/* Action buttons inside stop / hotel */
.actions{display:flex;flex-direction:column;gap:8px}
.action{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-xs);
  padding:14px 15px;color:var(--text);text-decoration:none;font-weight:700;font-size:14.5px;
  min-height:52px;transition:transform .12s var(--ease),border-color .2s var(--ease),background .2s var(--ease);
}
.action:active{transform:scale(.98)}
.action .lead{display:flex;align-items:center;gap:11px;min-width:0}
.action .lead .ic{font-size:18px;flex:0 0 auto}
.action .go{color:var(--nav);font-weight:800;white-space:nowrap;font-size:13px}
.action.nav{border-color:#28425f;background:#14202e}
.action.nav .go{color:var(--nav)}
.action.book .go{color:var(--bronze)}

/* ---------- Hotel card ---------- */
.hotel{
  background:linear-gradient(165deg,#1c1a16,#161616);
  border:1px solid var(--bronze-soft);border-radius:var(--radius);
  padding:18px 16px;margin-top:26px;box-shadow:var(--shadow-soft);
}
.hotel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.hotel-head h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.hotel-head .tag-booked{background:rgba(47,166,109,.16);color:#7fdcae;border:1px solid rgba(47,166,109,.4);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.hotel .addr{color:var(--muted);font-size:14px;margin:0 0 14px}
.hotel .feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.feat-item{background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-xs);padding:10px 12px;font-size:12.5px;color:#d4cfc6}
.feat-item b{display:block;color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:800}

/* ---------- Leitlhof wellness card ---------- */
.wellness-card{
  background:linear-gradient(165deg,#141c1a,#141414);
  border:1px solid #204039;border-radius:var(--radius);
  padding:18px 16px;margin-top:16px;
}
.wellness-card h3{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.ritual{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(150deg,#1c3a30,#15251f);border:1px solid #2f6b57;
  border-radius:var(--radius-sm);padding:14px 16px;margin:12px 0;
}
.ritual .t{font-size:15px;font-weight:800}
.ritual .time{font-size:24px;font-weight:900;color:#7fdcae;line-height:1}
.ritual .tag-booked{background:rgba(47,166,109,.2);color:#8fe3b8;border:1px solid rgba(47,166,109,.5);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800}

/* ---------- Timeline (day 12) ---------- */
.timeline{margin:8px 0 4px;padding:2px 0 2px 6px}
.tl-item{position:relative;padding:0 0 20px 30px}
.tl-item::before{content:"";position:absolute;left:5px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bronze);box-shadow:0 0 0 4px var(--bronze-glow)}
.tl-item::after{content:"";position:absolute;left:10px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.tl-item:last-child::after{display:none}
.tl-item.key::before{background:var(--nav);box-shadow:0 0 0 4px rgba(79,156,240,.2)}
.tl-item.end::before{background:var(--done);box-shadow:0 0 0 4px rgba(47,166,109,.2)}
.tl-time{font-weight:900;font-size:13px;color:var(--bronze);letter-spacing:.02em}
.tl-item.key .tl-time{color:var(--nav)}
.tl-item.end .tl-time{color:var(--done)}
.tl-title{font-weight:700;font-size:15px;margin-top:1px}
.tl-note{color:var(--muted);font-size:13px;margin-top:2px}

/* Depart advice highlight */
.depart-advice{
  display:flex;align-items:center;gap:13px;
  background:linear-gradient(150deg,#241d13,#1a1610);border:1px solid var(--bronze-deep);
  border-radius:var(--radius-sm);padding:14px 16px;margin:6px 0 16px;
}
.depart-advice .big{font-size:26px;font-weight:900;color:var(--bronze);line-height:1}
.depart-advice .lbl{font-size:12px;color:var(--faint);text-transform:uppercase;font-weight:800;letter-spacing:.05em}
.depart-advice .txt{font-size:13.5px;color:#e5d6bf;line-height:1.4}

/* Lists: restaurants / gopro / fotospots / fuel */
.mini-block{margin:18px 0}
.mini-block h4{margin:0 0 9px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--text);
  transition:transform .12s var(--ease),border-color .2s var(--ease);
}
.chip:active{transform:scale(.96)}
.chip .ic{font-size:15px}
.fuel-note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bronze);border-radius:var(--radius-xs);padding:12px 14px;font-size:13.5px;color:#d8d3ca;line-height:1.5}

/* ---------- Modular Garda pool ---------- */
.pool-intro{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px;color:var(--muted);font-size:14px;line-height:1.55}
.pool-intro b{color:var(--text)}

/* ---------- Practical / checklist tab ---------- */
.checklist-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.cl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
.cl-head h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.cl-count{font-size:12px;color:var(--faint);font-weight:800}
.cl-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.checklist-group.open .cl-body{max-height:1200px}
.cl-item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-soft);cursor:pointer}
.cl-item .box{width:26px;height:26px;border-radius:8px;border:2px solid #5c5c5a;display:grid;place-items:center;background:#141414;transition:all .2s var(--ease)}
.cl-item input{position:absolute;opacity:0;pointer-events:none}
.cl-item input:checked + .box{background:var(--done);border-color:var(--done)}
.cl-item .box::after{content:"✓";font-weight:900;color:#0c1a12;opacity:0;font-size:14px;transition:opacity .2s}
.cl-item input:checked + .box::after{opacity:1}
.cl-item span.lbl{font-size:15px;transition:color .2s,opacity .2s}
.cl-item input:checked ~ span.lbl{color:var(--muted);text-decoration:line-through;opacity:.7}

/* ---------- Floating action dock ---------- */
.fab-dock{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:12px}
.fab-toggle{
  width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(150deg,var(--bronze),var(--bronze-deep));
  box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 1px rgba(199,154,99,.3);
  display:grid;place-items:center;transition:transform .25s var(--ease)}
.fab-toggle .fab-icon{font-size:26px;transition:transform .3s var(--ease)}
.fab-dock.open .fab-toggle{transform:rotate(45deg) scale(1.04)}
.fab-dock.open .fab-toggle .fab-icon{transform:rotate(-45deg)}
.fab-menu{display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.fab-item{
  display:flex;align-items:center;gap:10px;border:none;cursor:pointer;
  background:rgba(28,28,28,.96);backdrop-filter:blur(10px);color:var(--text);
  border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-weight:700;font-size:14.5px;
  box-shadow:var(--shadow-soft);
  opacity:0;transform:translateY(12px) scale(.9);transition:all .28s var(--ease);
}
.fab-item span{font-size:18px}
.fab-dock.open .fab-menu{pointer-events:auto}
.fab-dock.open .fab-item{opacity:1;transform:none}
.fab-dock.open .fab-item:nth-child(1){transition-delay:.02s}
.fab-dock.open .fab-item:nth-child(2){transition-delay:.05s}
.fab-dock.open .fab-item:nth-child(3){transition-delay:.08s}
.fab-dock.open .fab-item:nth-child(4){transition-delay:.11s}
.fab-dock.open .fab-item:nth-child(5){transition-delay:.14s}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:#2a2a2a;color:var(--text);border:1px solid var(--line);
  padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Footer note ---------- */
.foot{margin:30px 0 10px;text-align:center;color:var(--faint);font-size:12px;line-height:1.6}

/* ---------- Wider screens ---------- */
@media(min-width:620px){
  .day-hero h2{font-size:34px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  .stat-strip{grid-template-columns:1fr 1fr}
  .routes{grid-template-columns:1fr}
  .hotel .feat{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* =========================================================
   STORE — LocalStorage
   ========================================================= */
const STORE_KEY = 'roadtrip2026.v1';
const store = (() => {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ data = {}; }
  return {
    get: k => !!data[k],
    set: (k, v) => { data[k] = v; try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){} },
    all: () => data
  };
})();

/* =========================================================
   RENDER helpers
   ========================================================= */
const el = (tag, cls, html) => { const n = document.createElement(tag); if(cls) n.className = cls; if(html!=null) n.innerHTML = html; return n; };
const stars = n => '★★★★★☆☆☆☆☆'.slice(5-n, 10-n);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

function stopKey(dayId, cat, stop){ return `${dayId}-${cat}-${slug(stop.title)}`; }

function renderStop(dayId, cat, stop){
  const key = stopKey(dayId, cat, stop);
  const done = store.get(key);
  const card = el('article', 'stop' + (done ? ' done' : ''));
  card.dataset.key = key;

  // ---- summary (clickable to open, checkbox toggles done) ----
  const sub = [];
  sub.push(`<span class="stars">${stars(stop.stars)}</span>`);
  sub.push(`<span>⏱ ${stop.time}</span>`);
  const summary = el('div', 'stop-summary');
  summary.innerHTML = `
    <label class="check" aria-label="Afvinken">
      <input type="checkbox" ${done?'checked':''}>
      <span class="box"></span>
    </label>
    <span class="stop-emoji">${stop.emoji}</span>
    <div class="stop-main">
      <div class="stop-title">${stop.title}</div>
      <div class="stop-sub">${sub.join('')}</div>
    </div>
    <span class="chev">▾</span>`;
  card.appendChild(summary);

  // ---- body ----
  const body = el('div', 'stop-body');
  const pills = [];
  if (stop.best) pills.push(`<span class="pill best">☀️ ${stop.best}</span>`);
  if (stop.weather) pills.push(`<span class="pill weather">🌦️ ${stop.weather}</span>`);
  let bodyHtml = '';
  if (pills.length) bodyHtml += `<div class="info-row">${pills.join('')}</div>`;
  bodyHtml += `<p>${stop.desc}</p>`;
  if (stop.tip) bodyHtml += `<div class="tip"><b>Tip &nbsp;</b><span>${stop.tip}</span></div>`;

  // actions: parking, navigate, photo (+ optional special P2)
  let acts = '<div class="actions">';
  if (stop.special === 'p2'){
    acts += `<a class="action nav" href="${mapsSearch('Parcheggio P2 Lago di Braies Prags')}" target="_blank" rel="noopener">
      <span class="lead"><span class="ic">🅿️</span> Navigeer naar P2 <em style="color:var(--muted);font-style:normal">· geboekt</em></span><span class="go">Maps →</span></a>`;
  }
  if (stop.parking){
    acts += `<a class="action" href="${mapsSearch(stop.parking)}" target="_blank" rel="noopener">
      <span class="lead"><span class="ic">🚗</span> Parkeren</span><span class="go">Maps →</span></a>`;
  }
  const navQuery = stop.nav || stop.title.split(/ — | \/ | \(/)[0].trim();
  acts += `<a class="action nav" href="${mapsSearch(navQuery)}" target="_blank" rel="noopener">
      <span class="lead"><span class="ic">🧭</span> Navigeer hierheen</span><span class="go">Maps →</span></a>`;
  if (stop.photo){
    acts += `<a class="action" href="${mapsSearch(stop.photo)}" target="_blank" rel="noopener">
      <span class="lead"><span class="ic">📸</span> Fotospot</span><span class="go">Maps →</span></a>`;
  }
  acts += '</div>';
  bodyHtml += acts;
  body.innerHTML = bodyHtml;
  card.appendChild(body);

  // ---- interactions ----
  const input = summary.querySelector('input');
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('change', () => {
    store.set(key, input.checked);
    card.classList.toggle('done', input.checked);
    updateProgress();
    toast(input.checked ? '✓ Afgevinkt' : 'Vinkje weggehaald');
  });
  summary.addEventListener('click', e => {
    if (e.target.closest('.check')) return;
    card.classList.toggle('open');
  });
  return card;
}

function catBlock(dayId, cat, label, stops){
  if (!stops || !stops.length) return null;
  const frag = document.createDocumentFragment();
  const head = el('div', `cat-head cat-${cat}`, `<span class="cat-dot"></span>${label}`);
  frag.appendChild(head);
  stops.forEach(s => frag.appendChild(renderStop(dayId, cat, s)));
  return frag;
}

function miniBlock(title, items){
  if (!items || !items.length) return null;
  const b = el('div', 'mini-block');
  b.appendChild(el('h4', null, title));
  const list = el('div', 'chiplist');
  items.forEach(it => {
    const a = el('a', 'chip');
    a.href = mapsSearch(it.q); a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<span class="ic">📍</span>${it.t}`;
    list.appendChild(a);
  });
  b.appendChild(list);
  return b;
}

function renderHotel(h){
  if (!h) return null;
  const card = el('section', h.wellness && h.name.includes('Leitlhof') ? 'hotel' : 'hotel');
  const bookedTag = h.booked ? `<span class="tag-booked">✓ ${h.bookedLabel || 'geboekt'}</span>` : '';
  let feats = '';
  const addFeat = (k,v)=>{ if(v && v!=='—') feats += `<div class="feat-item"><b>${k}</b>${v}</div>`; };
  addFeat('Inchecken', h.checkin);
  addFeat('Parkeren', h.parking);
  addFeat('EV laden', h.ev);
  addFeat('Restaurant', h.restaurant);
  addFeat('Wellness', h.wellness);

  let acts = '<div class="actions" style="margin-top:14px">';
  acts += `<a class="action nav" href="${mapsSearch(h.mapsQuery)}" target="_blank" rel="noopener">
    <span class="lead"><span class="ic">🧭</span> Navigeer naar hotel</span><span class="go">Maps →</span></a>`;
  acts += `<a class="action" href="${mapsSearch(h.mapsQuery)}" target="_blank" rel="noopener">
    <span class="lead"><span class="ic">📞</span> Adres & telefoon</span><span class="go">Maps →</span></a>`;
  if (h.website) acts += `<a class="action book" href="${gsearch(h.website + ' officiële website')}" target="_blank" rel="noopener">
    <span class="lead"><span class="ic">🌐</span> Website</span><span class="go">Zoek →</span></a>`;
  if (h.bookingQuery) acts += `<a class="action book" href="${booking(h.bookingQuery)}" target="_blank" rel="noopener">
    <span class="lead"><span class="ic">🛏️</span> Booking</span><span class="go">Open →</span></a>`;
  acts += '</div>';

  card.innerHTML = `
    <div class="hotel-head"><h3>🏨 ${h.name}</h3>${bookedTag}</div>
    <p class="addr">${h.address}</p>
    ${feats ? `<div class="feat">${feats}</div>` : ''}
    ${acts}`;
  return card;
}

function renderWellness(w){

  card.innerHTML = `
    <h3>🧖 Leitlhof Spa & Wellbeing</h3>
    <div class="ritual">
      <div><div class="t">Wellbeing Ritual</div><div style="color:var(--muted);font-size:12.5px;margin-top:2px">Vaste afspraak</div></div>
      <div style="text-align:right"><div class="time">${w.ritualTime}</div><span class="tag-booked">✓ geboekt</span></div>
    </div>

      <div class="feat-item"><b>Spa openingstijden</b>${w.spa}</div>
      <div class="feat-item"><b>Zwembad</b>${w.pool}</div>
      <div class="feat-item"><b>Sauna</b>${w.sauna}</div>
      <div class="feat-item"><b>Textielvrij</b>${w.textileFree}</div>

function renderTimeline(items){
  const wrap = el('div', 'mini-block');
  wrap.appendChild(el('h4', null, '⏱ Tijdlijn van de dag'));
  const tl = el('div', 'timeline');
  items.forEach(it => {
    const item = el('div', 'tl-item' + (it.cls ? ' ' + it.cls : ''));
    item.innerHTML = `<div class="tl-time">${it.time}</div><div class="tl-title">${it.title}</div>${it.note?`<div class="tl-note">${it.note}</div>`:''}`;
    tl.appendChild(item);
  });
  wrap.appendChild(tl);
  return wrap;
}

/* ---------- Full day panel ---------- */
function renderDay(day, index){
  const panel = el('section', 'panel');
  panel.dataset.index = index;
  panel.id = 'panel-' + day.id;

  // hero
  const hero = el('div', 'day-hero');
  hero.innerHTML = `<div class="day-eyebrow">${day.eyebrow}</div>
    <h2>${day.title}</h2><p class="subtitle">${day.subtitle}</p>`;
  panel.appendChild(hero);

  // stat strip (skip for pool day)
  if (!day.isPool){
    const strip = el('div', 'stat-strip');
    strip.innerHTML = `
      <div class="stat accent"><span class="k">Afstand</span><span class="v">${day.km}</span></div>
      <div class="stat"><span class="k">Rijtijd</span><span class="v">${day.drive}</span></div>
      <div class="stat nav"><span class="k">Vertrek</span><span class="v">${day.depart}</span></div>
      <div class="stat"><span class="k">Aankomst</span><span class="v">${day.arrive}</span></div>`;
    panel.appendChild(strip);
  }

  // routes
  if (day.route){
    const routes = el('div', 'routes');
    const comfort = mapsDir(day.route.origin, day.route.dest);
    const epic = mapsDir(day.route.origin, day.route.dest, day.route.epic);
    routes.innerHTML = `
      <a class="route-btn route-comfort" href="${comfort}" target="_blank" rel="noopener">🟢 Comfort route<small>Snelste weg</small></a>
      <a class="route-btn route-epic" href="${epic}" target="_blank" rel="noopener">🔥 Epic route<small>Langs de highlights</small></a>`;
    panel.appendChild(routes);
  }

  // depart advice (day 12)
  if (day.departAdvice){
    const da = el('div', 'depart-advice');
    da.innerHTML = `<div><div class="lbl">Aanbevolen vertrek</div><div class="big">${day.departAdvice.time}</div></div>
      <div class="txt">${day.departAdvice.text}</div>`;
    panel.appendChild(da);
  }

  // weather + advice banners
  if (day.weather) panel.appendChild(el('div', 'banner banner-advice', `<strong>Weer:</strong> ${day.weather}`));
  if (day.badWeather) panel.appendChild(el('div', 'banner banner-weather', `<strong>Bij slecht weer:</strong> ${day.badWeather}`));
  if (day.advice) panel.appendChild(el('div', 'banner banner-advice', `<strong>Mijn keuze:</strong> ${day.advice}`));

  // timeline (day 12)
  if (day.timeline) panel.appendChild(renderTimeline(day.timeline));

  // ----- POOL day (Garda) -----
  if (day.isPool){
    if (day.poolIntro) panel.appendChild(el('div', 'pool-intro', `<b>Zo werkt het:</b> ${day.poolIntro}`));
    panel.appendChild(el('div', 'cat-head cat-nice', '<span class="cat-dot"></span>Kies je bestemmingen'));
    day.pool.forEach(s => panel.appendChild(renderStop(day.id, 'pool', s)));
  } else {
    // ----- normal categories -----
    const must = catBlock(day.id, 'must', '🟥 Must do', day.cats.must);
    const nice = catBlock(day.id, 'nice', '🟧 Leuk / nice to have', day.cats.nice);
    const bonus = catBlock(day.id, 'bonus', '🟩 Bonus', day.cats.bonus);
    if (must) panel.appendChild(must);
    if (nice) panel.appendChild(nice);
    if (bonus) panel.appendChild(bonus);
  }

  // mini-blocks
  const mb = miniBlock('🍝 Restauranttips', day.restaurants); if (mb) panel.appendChild(mb);
  const gp = miniBlock('🎬 GoPro-momenten', day.gopro); if (gp) panel.appendChild(gp);
  const fs = miniBlock('📸 Fotospots', day.fotospots); if (fs) panel.appendChild(fs);
  if (day.fuel){
    const f = el('div', 'mini-block');
    f.appendChild(el('h4', null, '⛽ Tankadvies'));
    f.appendChild(el('div', 'fuel-note', day.fuel));
    panel.appendChild(f);
  }

  // wellness (Leitlhof)
  if (day.wellness) panel.appendChild(renderWellness(day.wellness));

  // hotel
  const h = renderHotel(day.hotel); if (h) panel.appendChild(h);

  return panel;
}

/* ---------- Practical tab ---------- */
function renderPractical(){
  const panel = el('section', 'panel');
  panel.id = 'panel-practical';
  panel.dataset.index = DAYS.length;
  const hero = el('div', 'day-hero');
  hero.innerHTML = `<div class="day-eyebrow">Voor vertrek · onderweg</div>
    <h2>Roadtrip Checklist</h2><p class="subtitle">Afvinken wat klaar is — opgeslagen op dit toestel</p>`;
  panel.appendChild(hero);

  CHECKLISTS.forEach((g, gi) => {
    const group = el('div', 'checklist-group' + (gi===0?' open':''));
    const key = `cl-${slug(g.title)}`;
    const doneCount = g.items.filter((_,i)=>store.get(`${key}-${i}`)).length;
    const head = el('div', 'cl-head');
    head.innerHTML = `<h3><span>${g.icon}</span> ${g.title}</h3><span class="cl-count">${doneCount}/${g.items.length}</span>`;
    group.appendChild(head);
    const bodyWrap = el('div', 'cl-body');
    g.items.forEach((label, i) => {
      const ik = `${key}-${i}`;
      const done = store.get(ik);
      const item = el('label', 'cl-item');
      item.innerHTML = `<input type="checkbox" ${done?'checked':''}><span class="box"></span><span class="lbl">${label}</span>`;
      const input = item.querySelector('input');
      input.addEventListener('change', () => {
        store.set(ik, input.checked);
        const dc = g.items.filter((_,j)=>store.get(`${key}-${j}`)).length;
        head.querySelector('.cl-count').textContent = `${dc}/${g.items.length}`;
      });
      bodyWrap.appendChild(item);
    });
    group.appendChild(bodyWrap);
    head.addEventListener('click', () => group.classList.toggle('open'));
    panel.appendChild(group);
  });

  panel.appendChild(el('div', 'foot',
    'Roadtrip Companion 2026 · werkt volledig offline · alle voortgang staat lokaal op dit toestel.<br>Controleer bij vertrek altijd actuele weers- en verkeersinfo.'));
  return panel;
}

/* =========================================================
   TABS + navigation
   ========================================================= */
let current = 0;
const panels = [];
const tabsEl = document.getElementById('dayTabs');
const mainEl = document.getElementById('main');

function buildTabs(){
  DAYS.forEach((day, i) => {
    const b = el('button', 'day-tab' + (i===0?' active':''), `${day.tab.n}<span>${day.tab.label}</span>`);
    b.dataset.index = i;
    b.addEventListener('click', () => go(i));
    tabsEl.appendChild(b);
  });
  // practical tab
  const p = el('button', 'day-tab practical', `⚙️<span>Praktisch</span>`);
  p.dataset.index = DAYS.length;
  p.addEventListener('click', () => go(DAYS.length));
  tabsEl.appendChild(p);
}

function buildPanels(){
  DAYS.forEach((day, i) => { const panel = renderDay(day, i); panels.push(panel); mainEl.appendChild(panel); });
  const prac = renderPractical(); panels.push(prac); mainEl.appendChild(prac);
}

function go(i){
  if (i < 0 || i >= panels.length || i === current) {
    // still allow re-scroll to top on same tab
    if (i === current) window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  panels[current].classList.remove('active');
  panels[i].classList.add('active');
  current = i;

  [...tabsEl.children].forEach((t, ti) => t.classList.toggle('active', ti === i));
  // keep active tab visible in the scroller
  const activeTab = tabsEl.children[i];
  if (activeTab) activeTab.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});

  // subtitle
  const st = document.getElementById('headerSubtitle');
  if (i < DAYS.length) st.textContent = DAYS[i].eyebrow;
  else st.textContent = 'Checklist & praktische info';

  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- Swipe between tabs ---------- */
function initSwipe(){
  let x0=null, y0=null, t0=0;
  mainEl.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
  }, {passive:true});
  mainEl.addEventListener('touchend', e => {
    if (x0===null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.8 && dt < 600){
      if (dx < 0) go(Math.min(current+1, panels.length-1));
      else go(Math.max(current-1, 0));
    }
    x0 = y0 = null;
  }, {passive:true});
}

/* =========================================================
   PROGRESS ring (telt alle stops over alle dagen)
   ========================================================= */
function allStopKeys(){
  const keys = [];
  DAYS.forEach(day => {
    if (day.isPool){ day.pool.forEach(s => keys.push(stopKey(day.id,'pool',s))); }
    else if (day.cats){
      ['must','nice','bonus'].forEach(cat => (day.cats[cat]||[]).forEach(s => keys.push(stopKey(day.id,cat,s))));
    }
  });
  return keys;
}
function updateProgress(){
  const keys = allStopKeys();
  const done = keys.filter(k => store.get(k)).length;
  const pct = keys.length ? Math.round(done/keys.length*100) : 0;
  const ring = document.getElementById('progressRing');
  ring.style.setProperty('--p', pct + '%');
  document.getElementById('progressPct').textContent = pct + '%';
}

/* =========================================================
   FLOATING quick actions (met geolocatie)
   ========================================================= */
function initFab(){
  const dock = document.getElementById('fabDock');
  const toggle = document.getElementById('fabToggle');
  const menu = document.getElementById('fabMenu');
  toggle.addEventListener('click', () => {
    const open = dock.classList.toggle('open');
    menu.setAttribute('aria-hidden', open ? 'false' : 'true');
  });
  document.addEventListener('click', e => {
    if (!dock.contains(e.target)) { dock.classList.remove('open'); menu.setAttribute('aria-hidden','true'); }
  });

  const queries = {
    here:  {label:'je locatie',    build: (c)=> c ? mapsSearch(`${c.lat},${c.lng}`) : mapsSearch('mijn locatie')},
    food:  {label:'restaurants',   build: (c)=> c ? mapsSearch(`restaurants near ${c.lat},${c.lng}`) : mapsSearch('restaurant in de buurt')},
    coffee:{label:'koffie',        build: (c)=> c ? mapsSearch(`coffee near ${c.lat},${c.lng}`) : mapsSearch('koffie in de buurt')},
    fuel:  {label:'tankstations',  build: (c)=> c ? mapsSearch(`tankstation near ${c.lat},${c.lng}`) : mapsSearch('tankstation in de buurt')},
    photo: {label:'fotospots',     build: (c)=> c ? mapsSearch(`viewpoint near ${c.lat},${c.lng}`) : mapsSearch('scenic viewpoint in de buurt')}
  };

  menu.querySelectorAll('.fab-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const q = queries[btn.dataset.quick];
      dock.classList.remove('open'); menu.setAttribute('aria-hidden','true');
      if (navigator.geolocation){
        toast(`📍 Locatie ophalen…`);
        navigator.geolocation.getCurrentPosition(
          pos => openMaps(q.build({lat:pos.coords.latitude, lng:pos.coords.longitude})),
          ()  => { toast('Zonder GPS — algemene zoekopdracht'); openMaps(q.build(null)); },
          {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
        );
      } else {
        openMaps(q.build(null));
      }
    });
  });
}
function openMaps(url){ window.open(url, '_blank', 'noopener'); }

/* =========================================================
   TOAST
   ========================================================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  buildTabs();
  buildPanels();
  panels[0].classList.add('active');
  document.getElementById('headerSubtitle').textContent = DAYS[0].eyebrow;
  initSwipe();
  initFab();
  updateProgress();

  // progress ring jumps to first unfinished-ish day: go to today if within range? keep day 1.
  document.getElementById('progressRing').addEventListener('click', () => go(DAYS.length)); // -> praktisch/overzicht
}
document.addEventListener('DOMContentLoaded', boot);
